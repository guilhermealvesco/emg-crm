{% extends "base.html" %}
{% block title %}Entrar · EMG CRM{% endblock %}
{% block content %}
<div class="login">
  <div class="brand"><span class="logo">EMG</span></div>
  <p class="center muted" style="margin-top:0">CRM de captação · Consultoria de crédito</p>
  <div class="card">
    <form method="post" action="/login">
      <div class="field"><label>E-mail</label><input type="email" name="email" required autocomplete="username" inputmode="email"></div>
      <div class="field"><label>Senha</label><input type="password" name="password" required autocomplete="current-password"></div>
      <button class="btn block" type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
